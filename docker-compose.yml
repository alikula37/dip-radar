services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host ports are configurable so an occupied port never blocks the install:
      #   echo "BACKEND_PORT=8010" >> .env   (or run scripts/install.sh, which picks free ones)
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - db_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DB_DIR=${DB_DIR:-/data}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    volumes:
      - db_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DB_DIR=${DB_DIR:-/data}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped

  # Optional HTTPS reverse proxy: `docker compose --profile proxy up -d`
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
